name: Deploy Laravel to cPanel

on:
  push:
    branches:
      - main
      - fitur/keuangan # Menjalankan deploy jika ada push ke branch ini juga

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Sesuaikan dengan versi PHP server Anda
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, libxml, json, phar
        coverage: none

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev --optimize-autoloader

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM Dependencies & Build
      run: |
        npm ci
        npm run build
        
    - name: 📂 Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: / # Mengirim ke direktori default akun FTP (harap pastikan sudah mengarah ke folder utama aplikasi di cPanel)
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          .env.example
          .gitignore
          README.md
          phpunit.xml
