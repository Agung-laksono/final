name: Deploy Laravel to cPanel

on:
  push:
    branches:
      - main
      - fitur/keuangan # Menjalankan deploy jika ada push ke branch ini juga

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Sesuaikan dengan versi PHP server Anda
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, libxml, json, phar
        coverage: none

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev --optimize-autoloader

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM Dependencies & Build
      env:
        VITE_APP_NAME: "Laravel"
        VITE_PUSHER_APP_KEY: "e57d7a930ecb0fd913d9"
        VITE_PUSHER_APP_CLUSTER: "ap1"
      run: |
        npm install
        npm run build
        
    # Memaksa Git untuk mendeteksi file hasil build agar FTP-Deploy-Action mau meng-uploadnya
    - name: dYss Commit Build Artifacts (for FTP)
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add public/build/ -f || true
        git commit -m "Auto-commit build artifacts for deployment" || true
        
    - name: 📂 Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: / # Mengirim ke direktori default akun FTP (harap pastikan sudah mengarah ke folder utama aplikasi di cPanel)
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/vendor/**
          .env.example
          .gitignore
          README.md
          phpunit.xml
